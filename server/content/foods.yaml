  - id: orange_whole
    name: Whole orange
    category: fruit
    portion: 1 large
    carb_g: 22
    protein_g: 1
    fat_g: 0
    fiber_g: 4
    note: Same fruit with its fiber still attached.

  - id: banana_ripe
    name: Ripe banana
    category: fruit
    portion: 1 medium
    carb_g: 27
    protein_g: 1
    fat_g: 0
    fiber_g: 3

  - id: berries
    name: Mixed berries
    category: fruit
    portion: 1 cup
    carb_g: 17
    protein_g: 1
    fat_g: 0
    fiber_g: 6

  # --------------------------------------------------------------- dairy
  - id: yogurt_flavored
    name: Flavoured yogurt
    category: dairy
    portion: 6 oz
    carb_g: 24
    protein_g: 7
    fat_g: 2
    fiber_g: 0

  - id: yogurt_greek_plain
    name: Plain Greek yogurt
    category: dairy
    portion: 6 oz
    carb_g: 7
    protein_g: 17
    fat_g: 4
    fiber_g: 0
    note: Strained, so more protein and much less sugar.

  - id: milk_2pct
    name: 2% milk
    category: dairy
    portion: 8 oz
