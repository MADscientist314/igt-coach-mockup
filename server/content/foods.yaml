# Food library for the IGT Coach mock-up.
#
# Macronutrients are per the portion named in `portion`, rounded to whole
# grams, in the neighbourhood of USDA FoodData Central values. This is
# demonstration content for a user-interface mock-up, not a clinical
# nutrition database; the real study would source from FoodData Central and
# have the library reviewed by the diabetes educators who deliver the
# medical nutrition therapy this intervention is based on.
#
# `safety_flags` drive the pregnancy food-safety screen in blocklist.yaml.

foods:
  # ---------------------------------------------------------- breakfast
  - id: bagel_plain
    name: Plain bagel
    category: breakfast_grain
    portion: 1 medium (98 g)
    carb_g: 53
    protein_g: 10
    fat_g: 2
    fiber_g: 2
    note: Refined wheat, very little fiber, so it empties fast.

  - id: bagel_wholewheat
    name: Whole-wheat bagel
    category: breakfast_grain
    portion: 1 medium (98 g)
    carb_g: 48
    protein_g: 10
    fat_g: 2
    fiber_g: 7
    note: Same bagel, more intact bran. Slower to break down.

  - id: oats_steelcut
    name: Steel-cut oats
    category: breakfast_grain
    portion: 1 cup cooked
    carb_g: 29
    protein_g: 6
    fat_g: 3
    fiber_g: 5
    note: Coarser cut than instant, so it digests more slowly.

  - id: oats_instant
    name: Instant oatmeal
    category: breakfast_grain
    portion: 1 packet
    carb_g: 32
    protein_g: 4
    fat_g: 2
    fiber_g: 3
    note: Pre-cooked and milled fine, which speeds absorption.

  - id: cereal_flakes
    name: Corn flakes
    category: breakfast_grain
    portion: 1.5 cups
    carb_g: 36
    protein_g: 3
    fat_g: 0
    fiber_g: 1

  # --------------------------------------------------------------- bread
  - id: bread_white
    name: White sandwich bread
    category: bread
    portion: 2 slices
    carb_g: 28
    protein_g: 5
    fat_g: 2
    fiber_g: 2

  - id: bread_sourdough
    name: Sourdough
    category: bread
    portion: 2 slices
    carb_g: 26
    protein_g: 6
    fat_g: 1
    fiber_g: 3
    note: Fermentation lowers the rate of release a little.

  - id: bread_seeded_rye
    name: Seeded rye
    category: bread
    portion: 2 slices
    carb_g: 24
    protein_g: 7
    fat_g: 4
    fiber_g: 7
    note: Dense crumb and whole seeds, so it releases gradually.

  - id: tortilla_flour
    name: Flour tortilla
    category: bread
    portion: 1 large
    carb_g: 36
    protein_g: 6
    fat_g: 6
    fiber_g: 2

  - id: tortilla_corn
    name: Corn tortillas
    category: bread
    portion: 2 small
    carb_g: 24
    protein_g: 3
    fat_g: 2
    fiber_g: 4
    note: Masa, nixtamalised, with more intact structure than flour.

  # ---------------------------------------------------------- rice/grain
  - id: rice_white
    name: White rice
    category: rice_grain
    portion: 1 cup cooked
    carb_g: 45
    protein_g: 4
    fat_g: 0
    fiber_g: 1

  - id: rice_brown
    name: Brown rice
    category: rice_grain
    portion: 1 cup cooked
    carb_g: 45
    protein_g: 5
    fat_g: 2
    fiber_g: 4
    note: Bran layer left on. Same amount of carbohydrate, slower.

  - id: rice_white_cooled
    name: White rice, cooked and cooled
    category: rice_grain
    portion: 1 cup, chilled then reheated
    carb_g: 45
    protein_g: 4
    fat_g: 0
    fiber_g: 3
    note: Cooling forms resistant starch, which behaves more like fiber.

  - id: quinoa
    name: Quinoa
    category: rice_grain
    portion: 1 cup cooked
    carb_g: 39
    protein_g: 8
    fat_g: 4
    fiber_g: 5

  # --------------------------------------------------------------- pasta
  - id: pasta_white
    name: White pasta
    category: pasta
    portion: 1 cup cooked
    carb_g: 43
    protein_g: 8
    fat_g: 1
    fiber_g: 3

  - id: pasta_aldente_wholewheat
    name: Whole-wheat pasta, al dente
    category: pasta
    portion: 1 cup cooked
    carb_g: 37
    protein_g: 8
    fat_g: 2
    fiber_g: 6
    note: Cooked firm rather than soft, which slows breakdown.

  - id: pasta_chickpea
    name: Chickpea pasta
    category: pasta
    portion: 1 cup cooked
    carb_g: 32
    protein_g: 13
    fat_g: 4
    fiber_g: 8

  # ------------------------------------------------------------- potato
  - id: potato_mashed
    name: Mashed potato
    category: potato
    portion: 1 cup
    carb_g: 36
    protein_g: 4
    fat_g: 6
    fiber_g: 3

  - id: potato_roast_wedges
    name: Roasted potato wedges, skin on
    category: potato
    portion: 1 cup
    carb_g: 34
    protein_g: 4
    fat_g: 7
    fiber_g: 5
    note: Skin on and left in pieces rather than mashed.

  - id: sweet_potato
    name: Roasted sweet potato
    category: potato
    portion: 1 medium
    carb_g: 27
    protein_g: 2
    fat_g: 0
    fiber_g: 4

  # --------------------------------------------------------------- fruit
  - id: juice_orange
    name: Orange juice
    category: fruit
    portion: 8 oz
    carb_g: 26
    protein_g: 2
    fat_g: 0
    fiber_g: 0
