  # ------------------------------------------------------- protein adds
  - id: eggs_two
    name: Two eggs
    category: protein_add
    portion: 2 large
    carb_g: 1
    protein_g: 13
    fat_g: 10
    fiber_g: 0

  - id: chicken_breast
